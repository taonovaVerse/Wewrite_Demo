<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wewrite — AI 写作补全</title>
  </head>
  <body>
    <div id="app">
      <nav id="activitybar" aria-label="活动栏">
        <button class="activity-item active" data-view="explorer" title="资源管理器 (Ctrl+Shift+E)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h4l1.5 2H14v8H2z"/></svg>
        </button>
        <button class="activity-item" data-view="blueprint" title="章节细纲 (Ctrl+Shift+B)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1"/><path d="M2 6h12M6.5 6v7.5"/></svg>
        </button>
      </nav>

      <aside id="sidebar">
        <header id="sidebar-header"></header>
        <div id="sidebar-body"></div>
      </aside>

      <main id="editor-area">
        <div id="tabs" aria-label="编辑器标签页"></div>
        <div id="editor-wrap">
          <div id="editor-empty" class="hidden">打开一个章节，或在资源管理器里新建章节开始写作</div>
        </div>
      </main>
    </div>

    <footer id="statusbar" aria-label="状态栏"></footer>

    <div id="palette-overlay" class="overlay hidden">
      <div class="overlay-box">
        <span id="palette-label" class="overlay-label"></span>
        <input id="palette-input" class="overlay-input" placeholder="输入命令…" spellcheck="false" />
        <div id="palette-list" class="overlay-list"></div>
      </div>
    </div>

    <div id="quick-input-overlay" class="overlay hidden">
      <div class="overlay-box">
        <span id="quick-input-label" class="overlay-label"></span>
        <input id="quick-input-field" class="overlay-input" spellcheck="false" />
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
