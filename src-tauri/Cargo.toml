[package]
name = "wewrite"
version = "0.1.0"
description = "Wewrite — AI 写作补全"
authors = ["gg"]
edition = "2021"

[lib]
name = "wewrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
